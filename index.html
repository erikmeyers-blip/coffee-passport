<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Passport</title>
<meta name="theme-color" content="#24150E">
<meta name="description" content="South Minneapolis coffee shops: rate them, log visits and collect stamps.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="map" aria-label="Map of South Minneapolis coffee shops"></main>

  <div class="topbar">
    <button id="searchbar" class="searchbar" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search drinks or shops</button>
    <div id="chips" class="chips" role="toolbar" aria-label="Map filters"></div>
  </div>

  <div class="zoomctl">
    <button id="zin" type="button" aria-label="Zoom in">+</button>
    <button id="zout" type="button" aria-label="Zoom out">−</button>
    <button id="zall" class="all" type="button" aria-label="Show all of South Minneapolis">ALL</button>
  </div>

  <section id="drawer" class="drawer" aria-label="Shops">
    <div id="drawerHead" class="drawer-head"><div class="grab"></div><div id="drawerTitle" class="drawer-title"></div></div>
    <div id="drawerList" class="drawer-list"></div>
  </section>

  <div id="nav" class="navbar">
    <nav class="navpill" aria-label="Main">
      <button type="button" data-go="map" aria-label="Map" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z M9 4v14 M15 6v14"/></svg></button>
      <button type="button" data-go="search" aria-label="Search drinks"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 8h11v5a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5V8z M16 10h2a2 2 0 0 1 0 4h-2 M8 3v2 M12 3v2"/></svg></button>
      <button type="button" data-go="passport" aria-label="Passport"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="11" r="3"/><path d="M9 17h6"/></svg></button>
    </nav>
    <button id="fab" class="fab press wide" type="button"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log visit</button>
  </div>

  <div id="page" class="page" hidden></div>
  <div id="sheet" hidden></div>
  <div id="celebrate" class="celebrate" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <div id="signin" class="signin" hidden>
    <svg width="120" height="120" viewBox="0 0 44 44" aria-hidden="true"><path class="stamp-shape" fill="#E8742A" d=""/></svg>
    <h1 style="margin:0;font-size:44px;line-height:.9;font-weight:1000;font-variation-settings:'wdth' 125">Coffee<br>Passport</h1>
    <p>Sign in with your Google account to open your passport.</p>
    <div id="gbtn"></div>
  </div>

  <div id="splash" class="splash" role="presentation">
    <div class="glow" aria-hidden="true"></div>
    <div class="slam" style="position:relative;width:220px;height:220px">
      <svg width="220" height="220" viewBox="0 0 44 44" aria-hidden="true">
        <defs><clipPath id="splashcup"><path d="M14.5 18.5h13v6a6.5 6.5 0 0 1-6.5 6.5h0a6.5 6.5 0 0 1-6.5-6.5z"/></clipPath></defs>
        <path class="stamp-shape" fill="#E8742A" d=""/>
        <g clip-path="url(#splashcup)"><rect class="cupfill" x="12" y="20.5" width="18" height="12" fill="#6F3F1E"/></g>
        <path d="M14.5 18.5h13v6a6.5 6.5 0 0 1-6.5 6.5h0a6.5 6.5 0 0 1-6.5-6.5z M27.5 20.3h1.3a2.6 2.6 0 0 1 0 5.2h-1.6" fill="none" stroke="#24150E" stroke-width="1.3" stroke-linejoin="round"/>
      </svg>
    </div>
    <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:6px">
      <span class="kicker t" style="animation-delay:1.4s">SOUTH MINNEAPOLIS</span>
      <h1 class="t" style="animation-delay:1.55s">Coffee<br>Passport</h1>
      <span class="t" id="splashCount" style="animation-delay:1.75s;color:#D7C2B7;font-size:16px;margin-top:10px"></span>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
